<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Along for Week O5. Quiz</title>
    <meta name="description" content="This is a code along for making a quiz form and styling
    it so that it looks nice.">
    <meta name="author" content="James Leight">
    <link rel=" stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>☑️Basic HTML and CSS Quiz</h1>
    </header>
    <main class="box">
        <form action="">
            <div class="quiz-item box">
                <label for="q1" class="indexlabel">1. </label>
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2" class="indexlabel">2. </label>
                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3" class="indexlabel">3. </label>
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">A. &lt;!-- This is a comment --&gt;</option>
                    <option value="b">B. /* This is a comment */</option>
                    <option value="c">C. // This is a comment //</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4" class="indexlabel">4. </label>
                <label for="q4">What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" , id="q4" name="q4">
            </div>
            <div class="button">
                <button type="submit">Submit Quiz for Grading</button>
            </div>
        </form>
    </main>

        <p>©2025 | HTML Form - User Poll Activity | James Leight</p>

</body>

</html>
