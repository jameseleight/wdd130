<!-- WDD 130 Rafting Website Development - Contact Page
James Leight -->
<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Whitewater Rafting Adventures</title>
    <meta name="description" content="This is the contact page for the rafting Website.
    Customers can use this page to provide contact information and then expect an apprpriate response.">
    <meta name="author" content="James Leight">
    <link rel=" stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.png" alt="James Leight">
        <nav>
            <ul class="navlist">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="contactheader">Whitewater Rafting Adventures</h1>
        <div class="contactbody">
            <p>1730 Elm Ave</p>
            <p>Torrance, California</p>
            <p>+1 424 247 3826</p>
            <p>info@whitewater_rafting_adventures.com</p>
        </div>
        <section class="contactinfo">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3314.303926311723!2d-118.33067109941862!3d33.83027191153808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1764127172586!5m2!1sen!2sus"
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form>
                <div class="form-item columna">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                    <label for="useremial">Email</label>
                    <input type="email" id="useremial" name="useremial" placeholder="Placeholder" required>
                </div>
                <div class="form-item columnb">
                    <p>Message Purpose</p>
                    <input type="radio" id="generalinquiry" name="messagepurpose">
                    <label for="generalinquiry">General Inquiry</label>
                    <input type="radio" id="reservationquestion" name="messagepurpose">
                    <label for="reservationquestion">Reservation Question</label>
                    <input type="radio" id="websitesuggestion" name="messagepurpose">
                    <label for="websitesuggestion">Website Suggestion</label>
                </div>
                <div class="form-item columnc">
                    <label for="messagetext">Message</label>
                    <textarea id="messagetext" name="messagetext" rows="4" placeholder="Type here"></textarea>
                </div>
                <div class="form-item columnd">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="Submit">Get in Touch!</button>
            </form>
        </section>
        <section class="serveyou">
            <h2>We are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="An image of Jackson McKensie.  Jackson is one of our guides and he likes to
                            wear a suit when he is not rafting down class 5+ rapids.">
                <figcaption>Jackson McKensie - River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="An image of Sarah Smith.  Sarah is a marine commando veteran and has been the 
                            director of trip development since we were founded.">
                <figcaption>Sarah Smith - Director of Trip Development</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="An image of Hugo Soloman.  Hugo is our most experienced guide and loves to take 
                            his participants down the rapids to their certain doom  Hugo never met a rapid he 
                            didn't like.">
                <figcaption>Hugo Solomon - Lead Guide</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&#169; 2025, ☠️ Whitewater Rafting Adventures ☠️, James Leight</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="blank" rel="noopener noreferrer">
                <img src="images/facebook-icon.png" alt="Follow us on Facebook (Opens in new tab)">
            </a>
            <a href="https://linkedin.com" target="blank" rel="noopener noreferrer">
                <img src="images/linkedin-icon.png" alt="Follow us on LinkedIn (Opens in new tab)">
            </a>
            <a href="https://instagram.com" target="blank" rel="noopener noreferrer">
                <img src="images/instagram-icon.png" alt="Follow us on Instagram (Opens in new tab)">
            </a>
        </nav>
    </footer>
</body>

</html>
